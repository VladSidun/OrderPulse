name: Checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: order_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d order_tracking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/order_tracking_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/order_tracking_test
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade -1
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m pytest --cov=app --cov-report=term-missing
