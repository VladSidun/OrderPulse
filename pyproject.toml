[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-tracking-system"
version = "0.1.0"
description = "Web application for order accounting and status tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "pydantic-settings==2.15.0",
    "tzdata==2026.4",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx2==2.13.1",
    "ruff==0.16.10",
    "build==1.6.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "static/css/*.css", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: integration tests requiring TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
