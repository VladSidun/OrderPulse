<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    {% block styles %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Перейти до вмісту</a>
    <header class="app-header">
      <nav class="container" aria-label="Головна навігація">
        <a class="app-brand" href="{{ url_for('home') }}">{{ app_name }}</a>
      </nav>
    </header>
    <main id="main-content" class="container app-main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
