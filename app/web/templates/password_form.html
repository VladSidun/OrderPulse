{% extends 'base.html' %}
{% from "components.html" import heading, badge, empty %}
{% block content %}{{ heading('Скидання пароля') }}<p>{{ email }}</p><div class="alert alert-danger" role="alert">{% for field, message in errors.items() %}<p id="{{ field }}-error">{{ message }}</p>{% endfor %}</div>
<form method="post" action="/users/{{ user_id }}/password" class="entity-form" data-confirm="Скинути пароль і відкликати всі сесії?"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">Новий пароль</label><input id="password" name="password" type="password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password"{% if errors.get('password') %} aria-invalid="true" aria-describedby="password-error"{% endif %}><button class="btn btn-primary" type="submit" data-confirm="Скинути пароль і відкликати всі сесії?">Скинути пароль</button> <a href="/users/{{ user_id }}/edit">Скасувати</a></form>{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='js/workflow.js') }}" defer></script>{% endblock %}
